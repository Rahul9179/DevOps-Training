name: Deploy Web App - training-01-dev

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  PROJECT_PATH: './DevOpsTraining/DevOpsTraining/DevOpsTraining.csproj'
  TEST_PROJECT_PATH: './DevOpsTraining/DevOpsTraining.Tests/DevOpsTraining.Tests.csproj'
  MIN_PASS_PERCENT: 70

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test (Require >= 70% Pass Rate)
        run: |
          dotnet test ${{ env.TEST_PROJECT_PATH }} \
            --configuration Release \
            --verbosity normal \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory ./TestResults || true

          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          import glob
          import os
          import sys

          trx_files = glob.glob('./TestResults/**/*.trx', recursive=True)
          if not trx_files:
              print("ERROR: No .trx test report found. The test project may have failed to build.")
              sys.exit(1)

          tree = ET.parse(trx_files[0])
          root = tree.getroot()

          counters = next((elem for elem in root.iter() if elem.tag.endswith('Counters')), None)
          if counters is None:
              print("ERROR: Could not find <Counters> in test report.")
              sys.exit(1)

          total = int(counters.attrib.get('total', 0))
          executed = int(counters.attrib.get('executed', 0))
          passed = int(counters.attrib.get('passed', 0))
          failed = int(counters.attrib.get('failed', 0))

          if executed == 0:
              print("ERROR: No tests were executed.")
              sys.exit(1)

          pass_rate = (passed / executed) * 100
          min_rate = float(os.environ.get("MIN_PASS_PERCENT", 70))

          print(f"Test Summary -> Total: {total}, Executed: {executed}, Passed: {passed}, Failed: {failed}")
          print(f"Pass Rate: {pass_rate:.2f}% (Required: {min_rate:.2f}%)")

          if pass_rate < min_rate:
              print(f"FAILED: Pass rate {pass_rate:.2f}% is below the {min_rate:.2f}% threshold.")
              sys.exit(1)

          print("PASSED: Test threshold met. Proceeding to publish.")
          EOF

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D5535A134BA041A3AB9C3E2B01D070A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_73C19DD0054F4FF187F3C0A9D749DDD0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_47BCAD1298B14BC9A5624FA240EBB3E3 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'training-01-dev'
          package: .
